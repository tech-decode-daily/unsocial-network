name: Verify desktop archives
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [desktop-release, main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run package
      - run: node scripts/verify-archive.mjs
      - name: Test extracted Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive=Get-ChildItem dist/*.zip
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath build/native-check
          $env:UNSOCIAL_TEST_EXECUTABLE=(Resolve-Path 'build/native-check/Unsocial Network/Unsocial Network.exe').Path
          npm run test:desktop
      - name: Test extracted Linux application
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEBUG: pw:browser
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          sudo unzip -q dist/*.zip -d /opt
          app=/opt/unsocial-network
          ldd "$app/unsocial-network"
          sudo chmod 0755 "$app/chrome-sandbox"
          if [[ "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null)" == Y ]]; then
            sudo install -m 0644 "$app/unsocial-network.apparmor" /etc/apparmor.d/unsocial-network
            sudo apparmor_parser -r /etc/apparmor.d/unsocial-network
          fi
          UNSOCIAL_TEST_EXECUTABLE="$app/unsocial-network" xvfb-run -a npm run test:desktop
      - name: Test extracted macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p build/native-check
          archive=(dist/*.zip)
          ditto -x -k "${archive[0]}" build/native-check
          UNSOCIAL_TEST_EXECUTABLE="$PWD/build/native-check/Unsocial Network.app/Contents/MacOS/UnsocialNetwork" npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.runner }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Verify the release and build the local download page
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          cd dist
          for suffix in Windows-x64 Linux-x64 macOS-arm64 macOS-x64; do
            name="Unsocial-Network-$version-$suffix.zip"
            test -s "$name"
            sha256sum --check "$name.sha256"
          done
          sha256sum *.zip > SHA256SUMS.txt
          cd ..
          npm ci --ignore-scripts
          npm run build:site
          npm run test:site
      - name: Publish the tested archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          cd dist
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
              --title "Unsocial Network $version — desktop release candidate" \
              --notes-file ../CHANGELOG.md *.zip *.sha256 SHA256SUMS.txt
          else
            for asset in *.zip *.sha256 SHA256SUMS.txt; do
              digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                --jq ".assets[] | select(.name == \"$asset\") | .digest")
              test "$digest" = "sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            done
          fi
      - name: Deploy the download site from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --ref "$DEFAULT_BRANCH"

